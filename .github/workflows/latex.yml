name: Build LaTeX PDFs

permissions:
  contents: write

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compile Spanish CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - name: Compile English Resume
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex

      - name: Delete previous "latest" release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for previous 'latest' release..."
          if gh release view "latest" >/dev/null 2>&1; then
            echo "Deleting previous 'latest' release and tag..."
            gh release delete "latest" --yes --cleanup-tag
            echo "Deleted previous 'latest' release and tag"
          else
            echo "No previous 'latest' release to delete"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Resume
          generate_release_notes: true
          files: |
            main.pdf
            resume.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
